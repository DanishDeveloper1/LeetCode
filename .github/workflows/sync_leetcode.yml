name: Sync Leetcode Past Submissions
on:
  workflow_dispatch: # Allows you to manually click a button to run this anytime
  schedule:
    - cron: "0 8 * * 6" # Automatically checks for new submissions every Saturday

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run LeetCode Sync
        uses: joshcai/leetcode-sync@v1.5
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
